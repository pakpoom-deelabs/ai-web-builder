name: AI Software Factory

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: factory-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:   
  build-and-deploy:
    if: (!github.event.issue.pull_request) && (github.event.comment == null || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: "\U0001F3F7\uFE0F Label: Building"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "deployed,failed" 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "building"

      - name: Checkout Factory Repo
        uses: actions/checkout@v4

      - name: Format Repository Name
        id: format-name
        run: |
          RAW_NAME="${{ github.event.issue.title }}"
          CLEAN_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g' | sed 's/[^a-z0-9-]//g')
          echo "REPO_NAME=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate Claude Authentication
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "🔑 Validating Claude authentication..."
          if claude -p "respond with OK" --output-format json 2>&1 | grep -q '"type":"result"'; then
            echo "✅ Claude authentication is valid."
          else
            echo "::error::Claude authentication failed. Your OAuth token may have expired. Run 'claude setup-token' locally and update the CLAUDE_CODE_OAUTH_TOKEN secret."
            exit 1
          fi
      - name: Fetch Conversation History
        id: fetch-history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json title,body,comments --jq '{title: .title, body: .body, comments: [.comments[].body]}' > .conversation.json

      - name: Phase 1 - Project Manager (Natural Conversation)
        id: decision
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TEMPLATE=$(cat prompts/pm.md)
          CONVERSATION=$(cat .conversation.json)
          PROMPT="${TEMPLATE//\{\{CONVERSATION\}\}/$CONVERSATION}"

          echo "🤖 PM กำลังประเมินความต้องการ..."
          claude -p "$PROMPT" --permission-mode bypassPermissions --output-format json > decision_out.json 2>&1 || true
          
          JSON_RESULT=$(grep -E '^{"type":"result"' decision_out.json | head -n 1 | jq -r '.result')
          
          CLEAN_JSON=$(echo "$JSON_RESULT" | sed -n '/^{/,/^}/p')
          if [ -z "$CLEAN_JSON" ]; then
             CLEAN_JSON=$(echo "$JSON_RESULT" | sed 's/```json//g; s/```//g')
          fi
          
          ACTION=$(echo "$CLEAN_JSON" | jq -r '.action')
          
          if [ "$ACTION" == "ask" ]; then
            REPLY=$(echo "$CLEAN_JSON" | jq -r '.reply_message')
            echo "ACTION=ask" >> $GITHUB_OUTPUT
            echo "REPLY<<EOF" >> $GITHUB_OUTPUT
            echo "$REPLY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "PM ถามเพิ่ม: $REPLY"
          elif [ "$ACTION" == "build" ]; then
            BUILD_PROMPT=$(echo "$CLEAN_JSON" | jq -r '.build_prompt')
            echo "ACTION=build" >> $GITHUB_OUTPUT
            echo "$BUILD_PROMPT" > .prompt.txt
            cat prompts/builder.md >> .prompt.txt
            echo "PM พร้อมสร้างแล้ว"
          else
            echo "::warning::ไม่สามารถ parse PM decision ได้ จะสร้างด้วยข้อมูลที่มี"
            echo "ACTION=build" >> $GITHUB_OUTPUT
            if [ "${{ github.event_name }}" == "issues" ]; then
              echo "Task Description: ${{ github.event.issue.body }}" > .prompt.txt
            else
              echo "Additional Requirements: ${{ github.event.comment.body }}" > .prompt.txt
            fi
            cat prompts/builder.md >> .prompt.txt
          fi

      - name: Phase 1 - ถามเพิ่ม (Natural)
        if: steps.decision.outputs.ACTION == 'ask'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLY: ${{ steps.decision.outputs.REPLY }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$REPLY"
          
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "building" 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "waiting-for-user"

      - name: Initialize Child Repo
        if: steps.decision.outputs.ACTION == 'build'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: bash scripts/init-child-repo.sh

      - name: Setup Child Repo Config
        if: steps.decision.outputs.ACTION == 'build'
        env:
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: bash scripts/setup-child-config.sh

      - name: Build with Claude
        if: steps.decision.outputs.ACTION == 'build'
        id: claude_run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: bash scripts/build-with-claude.sh

      - name: Commit and Push
        if: steps.decision.outputs.ACTION == 'build'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: bash scripts/commit-and-push.sh

      - name: Deploy to Vercel
        if: steps.decision.outputs.ACTION == 'build'
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
          BASE_DOMAIN: deelabs.co
          DOMAIN_PREFIX: demo-
        run: bash scripts/deploy-vercel.sh

      - name: Reply to Issue
        if: steps.decision.outputs.ACTION == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LIVE_URL: ${{ steps.vercel_deploy.outputs.URL }}
          PUBLIC_DOMAIN: ${{ steps.vercel_deploy.outputs.PUBLIC_DOMAIN }}
          EVENT_NAME: ${{ github.event_name }}
          COST: ${{ steps.claude_run.outputs.COST }}
          IN_TOKENS: ${{ steps.claude_run.outputs.IN_TOKENS }}
          OUT_TOKENS: ${{ steps.claude_run.outputs.OUT_TOKENS }}
          VERIFY_PASSED: ${{ steps.claude_run.outputs.VERIFY_PASSED }}
        run: bash scripts/reply-to-issue.sh

      - name: Log Build to Postgres
        if: steps.decision.outputs.ACTION == 'build'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLIC_DOMAIN: ${{ steps.vercel_deploy.outputs.PUBLIC_DOMAIN }}
          LIVE_URL: ${{ steps.vercel_deploy.outputs.URL }}
          IN_TOKENS: ${{ steps.claude_run.outputs.IN_TOKENS }}
          OUT_TOKENS: ${{ steps.claude_run.outputs.OUT_TOKENS }}
          COST: ${{ steps.claude_run.outputs.COST }}
          VERIFY_PASSED: ${{ steps.claude_run.outputs.VERIFY_PASSED }}
        run: bash scripts/log-build.sh

      - name: "\U0001F3F7\uFE0F Label: Deployed"
        if: success() && steps.decision.outputs.ACTION == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "building" 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "deployed"

      - name: "\U0001F3F7\uFE0F Label: Failed"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "building" 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "failed"
