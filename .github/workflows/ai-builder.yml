name: AI Web Builder Workflow

on:
  issues:
    types: [opened]

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    
    # 1. ต้องเปิดสิทธิ์ให้ Action เขียนโค้ดและสร้าง PR ได้
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Let Claude generate the code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # ใช้ yes "y" ต่อท่อ (Pipe) ส่งคำว่า 'y' และ Enter เข้าไปรอกดอนุญาตเครื่องมือทุกตัวแบบอัตโนมัติ
          yes "y" | claude -p "คำสั่งของคุณคือ: $ISSUE_TITLE รายละเอียด: $ISSUE_BODY ลงมือสร้างและแก้ไขไฟล์ได้เลย"

      # 2. ขั้นตอนสร้าง Pull Request อัตโนมัติ
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          # ใช้ Token พื้นฐานของ GitHub ที่มีมาให้อยู่แล้ว ไม่ต้องสร้าง Secret เพิ่ม
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI generated code for Issue #${{ github.event.issue.number }}"
          title: "AI Implementation: ${{ github.event.issue.title }}"
          body: |
            🚀 Pull Request นี้ถูกสร้างอัตโนมัติโดย Claude Code CLI
            อ้างอิงความต้องการจาก Issue #${{ github.event.issue.number }}
            
            **สิ่งที่ควรทำ:**
            - [ ] ตรวจสอบโค้ดที่ AI เขียน
            - [ ] ทดสอบรันหน้าเว็บ
            - [ ] กดยืนยัน (Merge) หรือคอมเมนต์ให้ AI แก้ไขต่อ
          branch: "ai-feature/issue-${{ github.event.issue.number }}"
          base: "main"
