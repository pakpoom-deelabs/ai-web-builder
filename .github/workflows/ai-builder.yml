name: AI Web Builder Workflow

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  build-and-pr:
    # ทำงานเมื่อไม่ใช่บอทคอมเมนต์ และเช็คว่าเป็น Issue (ไม่ใช่ PR)
    if: (!github.event.issue.pull_request) && (github.event.comment == null || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to PR branch if exists
        run: |
          BRANCH_NAME="ai-feature/issue-${{ github.event.issue.number }}"
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH_NAME; then
            echo "พบ Branch ของงานนี้ สลับไปใช้ Branch: $BRANCH_NAME"
            git checkout $BRANCH_NAME
          else
            echo "เริ่มงานใหม่บน Branch main"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure CI Permissions for Claude
        run: |
          mkdir -p .claude
          cat << 'EOF' > .claude/settings.json
          {
            "permissions": {
              "defaultMode": "acceptEdits",
              "allow": {
                "Write": ["*"],
                "Edit": ["*"],
                "Read": ["*"],
                "Bash": ["*"]
              }
            }
          }
          EOF

      - name: Prepare Prompt securely
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" == "issues" ]; then
            echo "คำสั่งของคุณคือ: $ISSUE_TITLE" > .prompt.txt
            echo "รายละเอียด: $ISSUE_BODY" >> .prompt.txt
            echo "ลงมือสร้างและแก้ไขไฟล์ในโปรเจกต์นี้ได้เลย" >> .prompt.txt
          else
            echo "คำสั่งแก้ไขเพิ่มเติม: $COMMENT_BODY" > .prompt.txt
            echo "กรุณาแก้ไขไฟล์ให้ตรงตามความต้องการ" >> .prompt.txt
          fi

      - name: Let Claude generate the code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PROMPT=$(cat .prompt.txt)
          claude -p "$PROMPT" --permission-mode bypassPermissions

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI update for Issue #${{ github.event.issue.number }}"
          title: "AI Implementation: ${{ github.event.issue.title }}"
          body: |
            🚀 Pull Request นี้ถูกจัดการโดย AI Web Builder Workflow
            อ้างอิงความต้องการจาก Issue #${{ github.event.issue.number }}
            
            **สิ่งที่ควรทำ:**
            - [ ] ตรวจสอบโค้ดที่ AI เขียน
            - [ ] ทดสอบรันหน้าเว็บ
            - [ ] พิมพ์คอมเมนต์ใน Issue เดิมเพื่อสั่งแก้โค้ดเพิ่มเติม
            - [ ] กดยืนยัน (Merge) เมื่อพอใจ
          branch: "ai-feature/issue-${{ github.event.issue.number }}"
          base: "main"

      - name: Reply to Customer
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "✨ ผมได้อัปเดตโค้ดตามที่คุณสั่งเรียบร้อยแล้วครับ! สามารถตรวจสอบความเปลี่ยนแปลงได้ที่แท็บ Pull requests เลยครับ 🚀"
