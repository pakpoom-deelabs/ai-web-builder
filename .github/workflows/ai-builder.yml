name: AI Web Builder Workflow

on:
  issues:
    types: [opened]

jobs:
  build-and-pr:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure CI Permissions for Claude
        # สร้างไฟล์ตั้งค่าเพื่อบอก Claude ว่า "อนุญาตให้เขียนและแก้ไฟล์ได้ทุกไฟล์โดยไม่ต้องถาม"
        run: |
          mkdir -p .claude
          cat << 'EOF' > .claude/settings.json
          {
            "permissions": {
              "defaultMode": "acceptEdits",
              "allow": {
                "Write": ["*"],
                "Edit": ["*"],
                "Read": ["*"],
                "Bash": ["*"]
              }
            }
          }
          EOF

      - name: Let Claude generate the code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # ใช้ -p (Print mode / Headless) 
          # และใช้ --permission-mode bypassPermissions เพื่อปลดล็อกขั้นสุด
          claude -p "คำสั่ง: $ISSUE_TITLE รายละเอียด: $ISSUE_BODY ลงมือสร้างและแก้ไขไฟล์ได้เลย" --permission-mode bypassPermissions

      # 2. ขั้นตอนสร้าง Pull Request อัตโนมัติ
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          # ใช้ Token พื้นฐานของ GitHub ที่มีมาให้อยู่แล้ว ไม่ต้องสร้าง Secret เพิ่ม
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI generated code for Issue #${{ github.event.issue.number }}"
          title: "AI Implementation: ${{ github.event.issue.title }}"
          body: |
            🚀 Pull Request นี้ถูกสร้างอัตโนมัติโดย Claude Code CLI
            อ้างอิงความต้องการจาก Issue #${{ github.event.issue.number }}
            
            **สิ่งที่ควรทำ:**
            - [ ] ตรวจสอบโค้ดที่ AI เขียน
            - [ ] ทดสอบรันหน้าเว็บ
            - [ ] กดยืนยัน (Merge) หรือคอมเมนต์ให้ AI แก้ไขต่อ
          branch: "ai-feature/issue-${{ github.event.issue.number }}"
          base: "main"
