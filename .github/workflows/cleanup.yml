name: Cleanup Stale Sites

on:
  schedule:
    - cron: '0 4 * * *'   # Daily 04:00 UTC (~11:00 ICT)
  workflow_dispatch:
    inputs:
      inactive_days:
        description: "Delete sites whose updated_at is older than this many days"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          INACTIVE_DAYS: ${{ github.event.inputs.inactive_days || '10' }}
        run: bash scripts/cleanup-stale.sh
