name: AI Software Factory

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  build-and-deploy:
    if: (!github.event.issue.pull_request) && (github.event.comment == null || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Format Repository Name
        id: format-name
        run: |
          RAW_NAME="${{ github.event.issue.title }}"
          CLEAN_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g' | sed 's/[^a-z0-9-]//g')
          echo "REPO_NAME=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Initialize or Clone Child Repository
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: |
          if [ "${{ github.event_name }}" == "issues" ]; then
            echo "Creating new repository: $REPO_NAME"
            gh repo create "$REPO_NAME" --public --clone
            cd "$REPO_NAME"
            echo "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>$REPO_NAME</title></head><body><h1>Welcome to $REPO_NAME</h1></body></html>" > index.html
            git checkout -b main
            git add index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Initial commit"
            git push -u origin main
          else
            echo "Cloning existing repository: $REPO_NAME"
            gh repo clone "${{ github.repository_owner }}/$REPO_NAME"
          fi

      - name: Configure CI Permissions for Claude
        run: |
          REPO_NAME="${{ steps.format-name.outputs.REPO_NAME }}"
          mkdir -p $REPO_NAME/.claude
          cat << 'EOF' > $REPO_NAME/.claude/settings.json
          {
            "permissions": {
              "defaultMode": "acceptEdits",
              "allow": ["Write(*)", "Edit(*)", "Read(*)", "Bash(*)"]
            }
          }
          EOF

      - name: Prepare Prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" == "issues" ]; then
            echo "Task Description: $ISSUE_BODY" > .prompt.txt
            echo "This is a plain HTML/CSS/JS project. Please generate the website structure and content based on the user's requirements." >> .prompt.txt
          else
            echo "Additional Requirements: $COMMENT_BODY" > .prompt.txt
            echo "Please review the existing HTML/CSS/JS files and modify them to meet the new requirements." >> .prompt.txt
          fi

      - name: Let Claude generate the code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: |
          PROMPT=$(cat .prompt.txt)
          cd $REPO_NAME
          claude -p "$PROMPT" --permission-mode bypassPermissions

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: |
          cd $REPO_NAME
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔧 Update code by AI" && git push origin main)

      - name: Deploy to Vercel
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: |
          cd $REPO_NAME
          # เนื่องจากเป็น static HTML Vercel จะไม่ถามอะไรเยอะ สามารถ Deploy ได้เลย
          LIVE_URL=$(npx vercel deploy --prod --name "$REPO_NAME" --token $VERCEL_TOKEN --yes)
          echo "URL=$LIVE_URL" >> $GITHUB_OUTPUT

      - name: Reply to Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
          GITHUB_USER: ${{ github.repository_owner }}
          LIVE_URL: ${{ steps.vercel_deploy.outputs.URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" == "issues" ]; then
            MSG="✅ **Deployment Successful**
            
            The requested project has been generated and deployed.
            
            🌐 **Live Preview:** $LIVE_URL
            📦 **Source Repository:** https://github.com/$GITHUB_USER/$REPO_NAME
            
            _To request further modifications, please reply directly to this issue._"
          else
            MSG="✨ **Update Successful**
            
            The codebase has been updated based on your recent feedback.
            
            🌐 **Live Preview:** $LIVE_URL
            
            _If you need any further adjustments, feel free to leave another comment._"
          fi
          
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$MSG"
