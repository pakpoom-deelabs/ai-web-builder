name: AI Software Factory

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: factory-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:   
  build-and-deploy:
    if: (!github.event.issue.pull_request) && (github.event.comment == null || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: "\U0001F3F7\uFE0F Label: Building"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "deployed,failed" 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "building"

      - name: Format Repository Name
        id: format-name
        run: |
          RAW_NAME="${{ github.event.issue.title }}"
          CLEAN_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g' | sed 's/[^a-z0-9-]//g')
          echo "REPO_NAME=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate Claude Authentication
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "🔑 Validating Claude authentication..."
          if claude -p "respond with OK" --output-format json 2>&1 | grep -q '"type":"result"'; then
            echo "✅ Claude authentication is valid."
          else
            echo "::error::Claude authentication failed. Your OAuth token may have expired. Run 'claude setup-token' locally and update the CLAUDE_CODE_OAUTH_TOKEN secret."
            exit 1
          fi
      - name: Fetch Conversation History
        id: fetch-history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json title,body,comments --jq '{title: .title, body: .body, comments: [.comments[].body]}' > .conversation.json

      - name: Phase 1 - Project Manager (Natural Conversation)
        id: decision
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT="คุณคือ PM ที่เป็นมิตร กำลังคุยกับลูกค้าที่อยากได้เว็บไซต์

          ข้อมูลจากลูกค้า:
          $(cat .conversation.json)

          หน้าที่ของคุณ:
          1. ถ้าข้อมูลยังไม่ชัดเจนพอ → ตอบแบบเป็นธรรมชาติ ถามเพิ่มนิดหน่อย
          2. ถ้าข้อมูลพอแล้ว → สร้าง build_prompt สำหรับ developer

          **การตอบแบบ natural ตัวอย่าง:**
          - \"เข้าใจเลย! ช่วยบอกอีกนิด - อยากให้เว็บมีลุคแบบไหน? มีเว็บที่ชอบอยู่แล้วส่งมาได้ หรือบอกสั้นๆ ว่า 'ขายของ' ก็พอ เดี๋ยวจัดให้\"
          - \"โอเค! ขอถามเพิ่มนิดหนึ่ง - เว็บนี้เอาไว้ทำอะไร? มี reference หรือ mockup ไหม?\"

          **การตอบเมื่อพร้อม build:**
          - รวบรวม requirements ทั้งหมดเป็น comprehensive build_prompt
          - ระบุ assumptions ที่ AI ตัดสินใจเองด้วย

          **Output format (JSON):**
          {
            \"action\": \"ask\" หรือ \"build\",
            \"reply_message\": \"ข้อความถามลูกค้า (ถ้า action=ask)\",
            \"build_prompt\": \"prompt สำหรับ developer (ถ้า action=build)\"
          }

          IMPORTANT: ตอบเป็น JSON อย่างเดียว ไม่ต้องมี markdown หรือคำอธิบาย"
          
          echo "🤖 PM กำลังประเมินความต้องการ..."
          claude -p "$PROMPT" --permission-mode bypassPermissions --output-format json > decision_out.json 2>&1 || true
          
          JSON_RESULT=$(grep -E '^{"type":"result"' decision_out.json | head -n 1 | jq -r '.result')
          
          CLEAN_JSON=$(echo "$JSON_RESULT" | sed -n '/^{/,/^}/p')
          if [ -z "$CLEAN_JSON" ]; then
             CLEAN_JSON=$(echo "$JSON_RESULT" | sed 's/```json//g; s/```//g')
          fi
          
          ACTION=$(echo "$CLEAN_JSON" | jq -r '.action')
          
          if [ "$ACTION" == "ask" ]; then
            REPLY=$(echo "$CLEAN_JSON" | jq -r '.reply_message')
            echo "ACTION=ask" >> $GITHUB_OUTPUT
            echo "REPLY<<EOF" >> $GITHUB_OUTPUT
            echo "$REPLY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "PM ถามเพิ่ม: $REPLY"
          elif [ "$ACTION" == "build" ]; then
            BUILD_PROMPT=$(echo "$CLEAN_JSON" | jq -r '.build_prompt')
            echo "ACTION=build" >> $GITHUB_OUTPUT
            echo "$BUILD_PROMPT" > .prompt.txt
            echo "นี่คือ plain HTML/CSS/JS project สร้าง website ตาม requirements" >> .prompt.txt
            echo "PM พร้อมสร้างแล้ว"
          else
            echo "::warning::ไม่สามารถ parse PM decision ได้ จะสร้างด้วยข้อมูลที่มี"
            echo "ACTION=build" >> $GITHUB_OUTPUT
            if [ "${{ github.event_name }}" == "issues" ]; then
              echo "Task Description: ${{ github.event.issue.body }}" > .prompt.txt
            else
              echo "Additional Requirements: ${{ github.event.comment.body }}" > .prompt.txt
            fi
            echo "นี่คือ plain HTML/CSS/JS project สร้าง website ตาม requirements" >> .prompt.txt
          fi

      - name: Phase 1 - ถามเพิ่ม (Natural)
        if: steps.decision.outputs.ACTION == 'ask'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLY: ${{ steps.decision.outputs.REPLY }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$REPLY"
          
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "building" 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "waiting-for-user"

      - name: Initialize or Clone Child Repository
        if: steps.decision.outputs.ACTION == 'build'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: |
          if gh repo view "${{ github.repository_owner }}/$REPO_NAME" >/dev/null 2>&1; then
            echo "Repository $REPO_NAME already exists. Cloning it..."
            gh repo clone "${{ github.repository_owner }}/$REPO_NAME"
          else
            echo "Creating new repository: $REPO_NAME"
            gh repo create "$REPO_NAME" --public --clone
            cd "$REPO_NAME"
            gh auth setup-git
            echo "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>$REPO_NAME</title></head><body><h1>Welcome to $REPO_NAME</h1></body></html>" > index.html
            git checkout -b main
            git add index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Initial commit"
            git push -u origin main
          fi

      - name: Configure CI Permissions for Claude
        if: steps.decision.outputs.ACTION == 'build'
        run: |
          REPO_NAME="${{ steps.format-name.outputs.REPO_NAME }}"
          mkdir -p $REPO_NAME/.claude
          cat << 'EOF' > $REPO_NAME/.claude/settings.json
          {
            "permissions": {
              "defaultMode": "acceptEdits",
              "allow": ["Write(*)", "Edit(*)", "Read(*)", "Bash(*)"]
            }
          }
          EOF

      - name: Setup .gitignore for Child Repo
        if: steps.decision.outputs.ACTION == 'build'
        run: |
          REPO_NAME="${{ steps.format-name.outputs.REPO_NAME }}"
          cat << 'EOF' >> $REPO_NAME/.gitignore
          claude_out.json
          verify.log
          .claude/
          .vercel/
          EOF

      - name: Let Claude generate the code
        if: steps.decision.outputs.ACTION == 'build'
        id: claude_run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: |
          PROMPT=$(cat .prompt.txt)
          cd $REPO_NAME
          
          TOTAL_COST=0
          TOTAL_IN_TOKENS=0
          TOTAL_OUT_TOKENS=0
          
          CLAUDE_OK=false
          
          function run_claude() {
            local p="$1"
            echo "🤖 Prompting Claude..."
            claude -p "$p" --permission-mode bypassPermissions --output-format json > claude_out.json 2>&1 || true
            JSON_DATA=$(grep -E '^{"type":"result"' claude_out.json | head -n 1)
            if [ -n "$JSON_DATA" ]; then
              CLAUDE_OK=true
              echo "$JSON_DATA" | jq -r '.result'
              COST=$(echo "$JSON_DATA" | jq -r '.total_cost_usd // 0')
              IN_TOKENS=$(echo "$JSON_DATA" | jq -r '.usage.input_tokens // 0')
              OUT_TOKENS=$(echo "$JSON_DATA" | jq -r '.usage.output_tokens // 0')
              TOTAL_COST=$(awk "BEGIN {printf \"%.6f\", $TOTAL_COST + $COST}")
              TOTAL_IN_TOKENS=$((TOTAL_IN_TOKENS + IN_TOKENS))
              TOTAL_OUT_TOKENS=$((TOTAL_OUT_TOKENS + OUT_TOKENS))
            else
              echo "⚠️ Claude did not return a valid result."
              cat claude_out.json
            fi
          }
          
          # 1. Initial Code Generation
          run_claude "$PROMPT"
          
          if [ "$CLAUDE_OK" != "true" ]; then
            echo "::error::Claude failed to generate code. Aborting."
            exit 1
          fi
          
          # 2. Self-Healing Loop
          MAX_RETRIES=2
          ATTEMPT=1
          VERIFY_PASSED=false
          VERIFY_CMD="npx --yes prettier --write . && npx --yes htmlhint '**/*.html'"
          
          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "🔍 Running verification (Attempt $ATTEMPT/$MAX_RETRIES)..."
            if eval $VERIFY_CMD > verify.log 2>&1; then
              echo "✅ Verification passed!"
              VERIFY_PASSED=true
              break
            else
              echo "❌ Verification failed! Asking Claude to fix it..."
              ERROR_LOG=$(cat verify.log)
              FIX_PROMPT="The system ran code verification and found the following errors:
          $ERROR_LOG
          Please review the errors and fix the code to resolve them."
              run_claude "$FIX_PROMPT"
              ATTEMPT=$((ATTEMPT+1))
            fi
          done
          
          if [ "$VERIFY_PASSED" != "true" ]; then
            echo "::warning::Self-healing loop exhausted. Code may contain issues."
          fi
          
          echo "COST=$TOTAL_COST" >> $GITHUB_OUTPUT
          echo "IN_TOKENS=$TOTAL_IN_TOKENS" >> $GITHUB_OUTPUT
          echo "OUT_TOKENS=$TOTAL_OUT_TOKENS" >> $GITHUB_OUTPUT
          echo "VERIFY_PASSED=$VERIFY_PASSED" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        if: steps.decision.outputs.ACTION == 'build'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: |
          cd $REPO_NAME
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔧 Update code by AI" && git push origin main)

      - name: Deploy to Vercel
        if: steps.decision.outputs.ACTION == 'build'
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
        run: |
          cd $REPO_NAME
          # เนื่องจากเป็น static HTML Vercel จะไม่ถามอะไรเยอะ สามารถ Deploy ได้เลย
          LIVE_URL=$(npx vercel deploy --prod --name "$REPO_NAME" --token $VERCEL_TOKEN --yes)
          echo "URL=$LIVE_URL" >> $GITHUB_OUTPUT

      - name: Reply to Issue
        if: steps.decision.outputs.ACTION == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ steps.format-name.outputs.REPO_NAME }}
          GITHUB_USER: ${{ github.repository_owner }}
          LIVE_URL: ${{ steps.vercel_deploy.outputs.URL }}
          EVENT_NAME: ${{ github.event_name }}
          COST: ${{ steps.claude_run.outputs.COST }}
          IN_TOKENS: ${{ steps.claude_run.outputs.IN_TOKENS }}
          OUT_TOKENS: ${{ steps.claude_run.outputs.OUT_TOKENS }}
          VERIFY_PASSED: ${{ steps.claude_run.outputs.VERIFY_PASSED }}
        run: |
          VERIFY_NOTE=""
          if [ "$VERIFY_PASSED" != "true" ]; then
            VERIFY_NOTE="
          ⚠️ **Note:** Code verification did not fully pass. Please review the output carefully."
          fi
          if [ "$EVENT_NAME" == "issues" ]; then
            MSG="✅ **Deployment Successful**
            
            The requested project has been generated and deployed.
            
            🌐 **Live Preview (Deployment):** $LIVE_URL
            🌍 **Public Domain:** https://${REPO_NAME}.vercel.app
            📦 **Source Repository:** https://github.com/$GITHUB_USER/$REPO_NAME
            
            📊 **Usage Stats:**
            - **Tokens:** \`${IN_TOKENS} in\` / \`${OUT_TOKENS} out\`
            - **Estimated Cost:** \`\$${COST}\`
            ${VERIFY_NOTE}
            
            _To request further modifications, please reply directly to this issue._"
          else
            MSG="✨ **Update Successful**
            
            The codebase has been updated based on your recent feedback.
            
            🌐 **Live Preview (Deployment):** $LIVE_URL
            🌍 **Public Domain:** https://${REPO_NAME}.vercel.app
            
            📊 **Usage Stats:**
            - **Tokens:** \`${IN_TOKENS} in\` / \`${OUT_TOKENS} out\`
            - **Estimated Cost:** \`\$${COST}\`
            ${VERIFY_NOTE}
            
            _If you need any further adjustments, feel free to leave another comment._"
          fi
          
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$MSG"

      - name: "\U0001F3F7\uFE0F Label: Deployed"
        if: success() && steps.decision.outputs.ACTION == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "building" 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "deployed"

      - name: "\U0001F3F7\uFE0F Label: Failed"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label "building" 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --add-label "failed"
